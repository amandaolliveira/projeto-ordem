<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Ordem Paranormal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Ordem Paranormal - Painel de Investigação</h1>
    <form id="form-caso">
      <input type="text" id="campo-caso" placeholder="Descreva o caso paranormal..." required>
      <button type="submit">Designar Investigação</button>
    </form>
    <p id="mensagem-vazia">Nenhum caso paranormal pendente no momento. Olhos sempre abertos.</p>
    <ul id="lista-casos"></ul>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
